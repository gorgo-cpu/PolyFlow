<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Error pages stay out of the index -->
    <title>Page Not Found — Polyflow</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <style>
        @font-face {
            font-family: 'Outfit';
            font-style: normal;
            font-weight: 400 700;
            font-display: swap;
            src: url('/fonts/outfit-latin.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0A0A0A;
            color: #E8E4E0;
            font-family: 'Outfit', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            line-height: 1.7;
            font-size: 16px;
        }

        .page {
            max-width: 720px;
            margin: 0 auto;
            padding: 6rem 2rem 4rem;
        }

        .code {
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(232, 228, 224, 0.4);
            margin-bottom: 3rem;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 600;
            letter-spacing: -0.03em;
            margin-bottom: 1rem;
        }

        p {
            color: rgba(232, 228, 224, 0.75);
            margin-bottom: 2rem;
        }

        ul {
            list-style: none;
        }

        li {
            margin-bottom: 0.75rem;
        }

        a {
            color: #E8E4E0;
            text-decoration: none;
            border-bottom: 1px solid rgba(232, 228, 224, 0.3);
            transition: border-color 0.3s ease;
        }

        a:hover {
            border-color: #E8E4E0;
        }
    </style>
</head>

<body>
    <main class="page">
        <div class="code">404 — Off the blueprint</div>

            <li><a href="/about/">About</a></li>

        </ul>
    </main>
</body>

</html>
